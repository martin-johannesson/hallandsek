<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Hallandsek</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site-header">
    <h1>Hallandsek — Admin</h1>
    <p>Hantera produkter och bilder</p>
  </header>

  <!-- Login -->
  <div id="login-section">
    <div class="admin-login">
      <h2>Logga in</h2>
      <form id="login-form">
        <input type="text" id="password-input" placeholder="Lösenord" required>
        <input type="text" id="token-input" placeholder="GitHub Personal Access Token" required>
        <p id="login-error" class="error"></p>
        <button type="submit" class="btn btn-primary" style="width:100%;">Logga in</button>
      </form>
    </div>
  </div>

  <!-- Admin panel -->
  <div class="admin-panel">
    <main class="container">
      <div id="status" class="status-msg" style="display:none;"></div>

      <!-- Project list -->
      <div id="project-list-section">
        <div class="toolbar">
          <h2>Produkter</h2>
          <button class="btn btn-primary" onclick="window._newProject()">+ Ny produkt</button>
        </div>
        <div id="project-list" class="admin-projects"></div>
      </div>

      <!-- Editor -->
      <div id="editor" class="editor-panel" style="display:none;">
        <div class="toolbar">
          <h2 id="editor-title">Redigera produkt</h2>
          <div>
            <button class="btn btn-secondary" onclick="window._closeEditor()">Avbryt</button>
            <button class="btn btn-primary" onclick="window._saveProject()">Spara</button>
          </div>
        </div>

        <div class="form-group">
          <label for="proj-name">Namn</label>
          <input type="text" id="proj-name" placeholder="T.ex. Skärbräda i ek">
        </div>

        <div class="form-group">
          <label for="proj-desc">Beskrivning</label>
          <textarea id="proj-desc" placeholder="Beskriv produkten..."></textarea>
        </div>

        <div class="form-group">
          <label for="proj-price">Pris (SEK)</label>
          <input type="number" id="proj-price" placeholder="0" step="1" min="0">
        </div>

        <!-- Existing images -->
        <h3 style="margin-bottom:0.5rem;">Bilder</h3>
        <div id="image-thumbs" class="image-thumbnails"></div>

        <!-- Upload new images -->
        <div id="image-upload-area" class="image-upload-area">
          Klicka eller dra bilder hit
          <input type="file" id="image-file-input" accept="image/*" multiple style="display:none;">
        </div>
        <div id="pending-thumbs" class="image-thumbnails"></div>
      </div>
    </main>
  </div>

  <footer class="site-footer">
    &copy; 2026 Hallandsek — <a href="../index.html">Tillbaka till butiken</a>
  </footer>

  <script src="../js/admin.js?v=7"></script>
</body>
</html>
