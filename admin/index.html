<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Snickeriprojekt</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site-header">
    <h1>Snickeriprojekt — Admin</h1>
    <p>Hantera projekt, bilder och inköp</p>
  </header>

  <!-- Login -->
  <div id="login-section">
    <div class="admin-login">
      <h2>Logga in</h2>
      <form id="login-form">
        <input type="password" id="password-input" placeholder="Lösenord" required>
        <input type="text" id="token-input" placeholder="GitHub Personal Access Token" required>
        <p id="login-error" class="error"></p>
        <button type="submit" class="btn btn-primary" style="width:100%;">Logga in</button>
      </form>
    </div>
  </div>

  <!-- Admin panel -->
  <div class="admin-panel">
    <main class="container">
      <div id="status" class="status-msg" style="display:none;"></div>

      <!-- Project list -->
      <div id="project-list-section">
        <div class="toolbar">
          <h2>Projekt</h2>
          <button class="btn btn-primary" onclick="window._newProject()">+ Nytt projekt</button>
        </div>
        <div id="project-list" class="admin-projects"></div>
      </div>

      <!-- Editor -->
      <div id="editor" class="editor-panel" style="display:none;">
        <div class="toolbar">
          <h2 id="editor-title">Redigera projekt</h2>
          <div>
            <button class="btn btn-secondary" onclick="window._closeEditor()">Avbryt</button>
            <button class="btn btn-primary" onclick="window._saveProject()">Spara</button>
          </div>
        </div>

        <div class="form-group">
          <label for="proj-name">Namn</label>
          <input type="text" id="proj-name" placeholder="T.ex. Bokhylla i ek">
        </div>

        <div class="form-group">
          <label for="proj-desc">Beskrivning</label>
          <textarea id="proj-desc" placeholder="Beskriv projektet..."></textarea>
        </div>

        <div class="form-group">
          <label for="proj-date">Datum (YYYY-MM)</label>
          <input type="month" id="proj-date">
        </div>

        <!-- Existing images -->
        <h3 style="margin-bottom:0.5rem;">Bilder</h3>
        <div id="image-thumbs" class="image-thumbnails"></div>

        <!-- Upload new images -->
        <div id="image-upload-area" class="image-upload-area">
          Klicka eller dra bilder hit
          <input type="file" id="image-file-input" accept="image/*" multiple style="display:none;">
        </div>
        <div id="pending-thumbs" class="image-thumbnails"></div>

        <!-- Purchases -->
        <h3 style="margin:1rem 0 0.5rem;">Inköp</h3>
        <div id="purchase-rows" class="purchase-list"></div>
        <div id="purchase-total" class="purchase-total">Totalt: 0 kr</div>
        <button class="btn btn-secondary btn-sm" onclick="window._addPurchase()">+ Lägg till inköp</button>
      </div>
    </main>
  </div>

  <footer class="site-footer">
    &copy; 2026 Martin — <a href="../index.html">Tillbaka till galleriet</a>
  </footer>

  <script src="../js/admin.js"></script>
</body>
</html>
